<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographie TurtleBot3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.1.0/roslib.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2563eb, #1e40af);
            --secondary-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
            --text-color: #1f2937;
            --light-bg: #f8fafc;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f0f4f8;
            color: var(--text-color);
        }

        .nav-menu {
            background: var(--primary-gradient);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .mapping-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .map-view {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 1rem;
            min-height: 600px;
            position: relative;
        }

        .controls-panel {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
        }

        .status {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            background-color: #f87171;
            color: #7f1d1d;
            transition: all 0.3s ease;
        }

        .connected {
            background-color: #4ade80;
            color: #064e3b;
        }

        .control-button {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .control-button:active {
            transform: translateY(0);
        }

        .debug-info {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--light-bg);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .map-canvas {
            width: 100%;
            height: 600px;
            background: #eee;
            border-radius: 8px;
            cursor: grab;
        }

        .map-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            box-shadow: var(--card-shadow);
        }

        .zoom-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .zoom-button {
            width: 36px;
            height: 36px;
            border-radius: 5px;
            background: white;
            border: 1px solid #ccc;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .zoom-button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        @media (max-width: 1024px) {
            .mapping-container {
                grid-template-columns: 1fr;
            }
            
            .map-view {
                min-height: 400px;
            }
            
            .map-canvas {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="color: white; text-decoration: none;">
                    <i class="fas fa-robot"></i> TurtleBot3
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="controle.html">Contrôle</a>
                <a href="cartographie.html">Cartographie</a>
                <a href="navigation.html">Navigation</a>
            </div>
        </div>
    </nav>

    <header class="header">
        <h1>Cartographie TurtleBot3</h1>
        <p>Création et visualisation de cartes avec SLAM</p>
    </header>

    <div class="mapping-container">
        <div class="map-view">
            <canvas id="mapCanvas" class="map-canvas"></canvas>
            <div class="zoom-controls">
                <button id="zoomIn" class="zoom-button"><i class="fas fa-plus"></i></button>
                <button id="zoomOut" class="zoom-button"><i class="fas fa-minus"></i></button>
                <button id="resetView" class="zoom-button"><i class="fas fa-home"></i></button>
            </div>
            <div class="map-info" id="mapInfo">
                Déplacez la carte en faisant glisser la souris. Zoomez avec la molette.
            </div>
        </div>

        <div class="controls-panel">
            <div id="status" class="status">Déconnecté</div>
            
            <button id="startMapping" class="control-button">
                <i class="fas fa-play"></i> Démarrer SLAM
            </button>
            
            <button id="stopMapping" class="control-button">
                <i class="fas fa-stop"></i> Arrêter SLAM
            </button>
            
            <button id="saveMap" class="control-button">
                <i class="fas fa-save"></i> Sauvegarder la carte
            </button>

            <div class="debug-info" id="debug-log">
                Logs de débogage...
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let mapResolution = 0.05;
        let mapOrigin = { x: 0, y: 0 };
        let currentMapData = null;
        let robotPosition = null;
        let ros = null;
        window.mapTransform = { offsetX: 0, offsetY: 0, scale: 1 };

        // Référence au canvas et au contexte
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        function addDebugLog(message) {
            const debugLog = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            debugLog.innerHTML = `[${timestamp}] ${message}<br>` + debugLog.innerHTML;
        }

        // Connexion à ROS avec retry
        function connectToROS() {
            ros = new ROSLIB.Ros({
                url: 'ws://localhost:9090'
            });

            ros.on('connection', function() {
                console.log('Connecté à ROS');
                addDebugLog('Connecté à ROS');
                document.getElementById('status').textContent = 'Connecté';
                document.getElementById('status').classList.add('connected');
                
                // Configurer les souscriptions après la connexion
                setupSubscribers();
            });

            ros.on('error', function(error) {
                console.log('Erreur de connexion:', error);
                addDebugLog('Erreur de connexion, nouvelle tentative dans 3s...');
                document.getElementById('status').textContent = 'Erreur de connexion';
                document.getElementById('status').classList.remove('connected');
                setTimeout(connectToROS, 3000);
            });

            ros.on('close', function() {
                console.log('Connexion fermée');
                addDebugLog('Connexion fermée, nouvelle tentative dans 3s...');
                document.getElementById('status').textContent = 'Déconnecté';
                document.getElementById('status').classList.remove('connected');
                setTimeout(connectToROS, 3000);
            });

            return ros;
        }

        // Configurer les abonnements aux topics ROS
        function setupSubscribers() {
            // Souscription au topic de la carte
            var mapListener = new ROSLIB.Topic({
                ros: ros,
                name: '/map',
                messageType: 'nav_msgs/OccupancyGrid'
            });

            mapListener.subscribe(function(message) {
                console.log('Message de carte reçu');
                addDebugLog(`Nouvelle carte reçue: ${message.info.width}x${message.info.height}`);
                drawMap(message);
            });

            // Souscription à la position du robot (mode navigation)
            const poseListener = new ROSLIB.Topic({
                ros: ros,
                name: '/amcl_pose',
                messageType: 'geometry_msgs/PoseWithCovarianceStamped'
            });

            poseListener.subscribe(function(message) {
                robotPosition = message.pose.pose;
                addDebugLog("Position du robot mise à jour (AMCL)");
                updateRobotPosition(robotPosition);
            });
            
            // Souscription alternative pour le mode SLAM où /amcl_pose n'est pas disponible
            const slamPoseListener = new ROSLIB.Topic({
                ros: ros,
                name: '/tf',
                messageType: 'tf2_msgs/TFMessage'
            });
            
            slamPoseListener.subscribe(function(message) {
                // Rechercher les transformations base_footprint -> map
                for (let i = 0; i < message.transforms.length; i++) {
                    const transform = message.transforms[i];
                    if (transform.header.frame_id === 'map' && 
                        transform.child_frame_id === 'base_footprint') {
                        
                        const pose = {
                            position: transform.transform.translation,
                            orientation: transform.transform.rotation
                        };
                        
                        robotPosition = pose;
                        updateRobotPosition(pose);
                        break;
                    }
                }
            });
        }

        // Conversion des coordonnées ROS vers le canvas
        function ROSToCanvas(rosX, rosY) {
            if (!currentMapData || !window.mapTransform) return null;

            // Convertir de ROS vers la carte
            const mapX = (rosX - mapOrigin.x) / mapResolution;
            const mapY = (rosY - mapOrigin.y) / mapResolution;

            // Appliquer la transformation stockée
            const canvasX = window.mapTransform.offsetX + mapX * window.mapTransform.scale;
            const canvasY = window.mapTransform.offsetY + mapY * window.mapTransform.scale;

            return { x: canvasX, y: canvasY };
        }

        // Fonction pour dessiner uniquement la carte (sans le robot)
        function drawMapOnly(mapData) {
            // Nettoyer le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Récupérer les dimensions
            const mapWidth = mapData.info.width;
            const mapHeight = mapData.info.height;
            
            // Calculer l'échelle pour faire tenir la carte dans le canvas avec une marge
            if (!window.mapTransform.userModified) {
                const margin = 20; // marge en pixels
                const scaleX = (canvas.width - 2 * margin) / mapWidth;
                const scaleY = (canvas.height - 2 * margin) / mapHeight;
                const scale = Math.min(scaleX, scaleY);
                
                // Position centrée
                window.mapTransform.offsetX = Math.floor((canvas.width - mapWidth * scale) / 2);
                window.mapTransform.offsetY = Math.floor((canvas.height - mapHeight * scale) / 2);
                window.mapTransform.scale = scale;
            }
            
            // Créer une imageData pour la carte
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mapWidth;
            tempCanvas.height = mapHeight;
            const tempCtx = tempCanvas.getContext('2d');
            const imageData = tempCtx.createImageData(mapWidth, mapHeight);
            const data = imageData.data;
            
            // Amélioration des couleurs pour un meilleur contraste
            for (let i = 0; i < mapData.data.length; i++) {
                const val = mapData.data[i];
                const idx = i * 4;
                
                if (val === -1) { // Inconnu
                    data[idx] = 180;     // R
                    data[idx + 1] = 180; // G
                    data[idx + 2] = 180; // B
                    data[idx + 3] = 255; // A
                } else if (val === 100) { // Occupé (obstacles)
                    data[idx] = 0;       // R
                    data[idx + 1] = 0;   // G
                    data[idx + 2] = 0;   // B
                    data[idx + 3] = 255; // A
                } else if (val >= 0 && val < 50) { // Probablement libre (gradient de blanc à bleu clair)
                    const blueIntensity = Math.floor(200 - val * 4);
                    data[idx] = 255;     // R
                    data[idx + 1] = 255; // G
                    data[idx + 2] = 255; // B
                    data[idx + 3] = 255; // A
                } else { // Entre 50-99: probabilité d'occupation (gradient de bleu clair à gris)
                    const intensity = Math.floor(200 - (val - 50) * 2);
                    data[idx] = intensity;     // R
                    data[idx + 1] = intensity; // G
                    data[idx + 2] = 220;       // B (plus bleu)
                    data[idx + 3] = 255;       // A
                }
            }
            
            // Mettre l'image sur le canvas temporaire
            tempCtx.putImageData(imageData, 0, 0);
            
            // Dessiner l'image mise à l'échelle sur le canvas principal
            ctx.imageSmoothingEnabled = false; // Désactiver le lissage pour un rendu plus net
            ctx.drawImage(
                tempCanvas,
                0, 0, mapWidth, mapHeight,
                window.mapTransform.offsetX, 
                window.mapTransform.offsetY, 
                mapWidth * window.mapTransform.scale, 
                mapHeight * window.mapTransform.scale
            );
            
            // Dessiner une grille pour aider à visualiser l'échelle
            const gridSize = 1.0; // en mètres
            const gridSpacingPixels = gridSize / mapResolution * window.mapTransform.scale;
            
            ctx.beginPath();
            ctx.strokeStyle = "rgba(200, 200, 200, 0.5)";
            ctx.lineWidth = 0.5;
            
            // Origine (0,0) en ROS
            const originCanvas = ROSToCanvas(0, 0);
            
            if (originCanvas) {
                // Lignes verticales
                for (let x = 0; x <= mapWidth; x += gridSize / mapResolution) {
                    const posX = window.mapTransform.offsetX + x * window.mapTransform.scale;
                    ctx.moveTo(posX, window.mapTransform.offsetY);
                    ctx.lineTo(posX, window.mapTransform.offsetY + mapHeight * window.mapTransform.scale);
                }
                
                // Lignes horizontales
                for (let y = 0; y <= mapHeight; y += gridSize / mapResolution) {
                    const posY = window.mapTransform.offsetY + y * window.mapTransform.scale;
                    ctx.moveTo(window.mapTransform.offsetX, posY);
                    ctx.lineTo(window.mapTransform.offsetX + mapWidth * window.mapTransform.scale, posY);
                }
                ctx.stroke();
                
                // Axes X et Y plus visibles autour de (0,0)
                ctx.beginPath();
                ctx.strokeStyle = "rgba(255, 0, 0, 0.8)"; // Axe X en rouge
                ctx.lineWidth = 1.5;
                ctx.moveTo(originCanvas.x - 50, originCanvas.y);
                ctx.lineTo(originCanvas.x + 50, originCanvas.y);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.strokeStyle = "rgba(0, 128, 0, 0.8)"; // Axe Y en vert
                ctx.lineWidth = 1.5;
                ctx.moveTo(originCanvas.x, originCanvas.y - 50);
                ctx.lineTo(originCanvas.x, originCanvas.y + 50);
                ctx.stroke();
                
                // Marquer l'origine
                ctx.beginPath();
                ctx.arc(originCanvas.x, originCanvas.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(128, 0, 128, 0.8)"; // Violet
                ctx.fill();
            }
            
            // Dessiner une bordure autour de la carte
            ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
            ctx.lineWidth = 1;
            ctx.strokeRect(
                window.mapTransform.offsetX, 
                window.mapTransform.offsetY, 
                mapWidth * window.mapTransform.scale, 
                mapHeight * window.mapTransform.scale
            );
            
            // Ajouter une échelle
            const meterSize = 1 / mapResolution * window.mapTransform.scale; // taille d'1m en pixels
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(window.mapTransform.offsetX + 10, window.mapTransform.offsetY + 10, 150, 30);
            ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
            ctx.strokeRect(window.mapTransform.offsetX + 10, window.mapTransform.offsetY + 10, 150, 30);
            
            ctx.beginPath();
            ctx.moveTo(window.mapTransform.offsetX + 20, window.mapTransform.offsetY + 25);
            ctx.lineTo(window.mapTransform.offsetX + 20 + meterSize, window.mapTransform.offsetY + 25);
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = "12px Arial";
            ctx.fillStyle = "black";
            ctx.fillText("1 mètre", window.mapTransform.offsetX + 20 + meterSize/2 - 20, window.mapTransform.offsetY + 20);
            
            // Mettre à jour les infos de la carte
            const mapInfo = document.getElementById('mapInfo');
            mapInfo.innerHTML = `
                Dimensions: ${mapWidth}x${mapHeight} pixels | 
                Résolution: ${mapResolution} m/pixel | 
                Zoom: ${window.mapTransform.scale.toFixed(2)}x
            `;
            
            return window.mapTransform;
        }
        
        // Fonction principale pour dessiner la carte
        function drawMap(mapData) {
            // Mettre à jour les variables globales
            currentMapData = mapData;
            mapResolution = mapData.info.resolution;
            mapOrigin = {
                x: mapData.info.origin.position.x,
                y: mapData.info.origin.position.y
            };
            
            // Réinitialiser la transformation si c'est une nouvelle carte
            window.mapTransform.userModified = false;
            
            // Dessiner la carte
            drawMapOnly(mapData);
            
            // Si on a déjà la position du robot, la redessiner
            if (robotPosition) {
                updateRobotPosition(robotPosition);
            }
            
            addDebugLog(`Carte mise à jour: ${mapData.info.width}x${mapData.info.height}`);
        }
        
        // Mise à jour de la position du robot
        function updateRobotPosition(pose) {
            if (!currentMapData || !window.mapTransform) return;

            const canvasCoords = ROSToCanvas(pose.position.x, pose.position.y);
            if (!canvasCoords) return;
            
            // Effet de pulsation pour mettre en évidence le robot
            const now = Date.now();
            const pulseSize = 1 + 0.2 * Math.sin(now / 200); // Pulsation douce
            
            // Cercle de contour extérieur avec lueur
            ctx.beginPath();
            ctx.arc(canvasCoords.x, canvasCoords.y, 20 * pulseSize, 0, 2 * Math.PI);
            const gradient = ctx.createRadialGradient(
                canvasCoords.x, canvasCoords.y, 5,
                canvasCoords.x, canvasCoords.y, 20 * pulseSize
            );
            gradient.addColorStop(0, 'rgba(255, 100, 100, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 100, 100, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Robot principal - cercle rouge
            ctx.beginPath();
            ctx.arc(canvasCoords.x, canvasCoords.y, 12, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Cercle intérieur pour texture
            ctx.beginPath();
            ctx.arc(canvasCoords.x, canvasCoords.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(200, 0, 0, 1)';
            ctx.fill();
            
            // Direction - flèche plus élaborée
            const angle = 2 * Math.atan2(pose.orientation.z, pose.orientation.w);
            
            // Flèche de direction
            const arrowLength = 30;
            ctx.save();
            ctx.translate(canvasCoords.x, canvasCoords.y);
            ctx.rotate(angle);
            
            // Dessiner une flèche triangulaire
            ctx.beginPath();
            ctx.moveTo(12, 0); // Départ depuis le bord du cercle
            ctx.lineTo(arrowLength, -8);
            ctx.lineTo(arrowLength + 5, 0);
            ctx.lineTo(arrowLength, 8);
            ctx.closePath();
            
            // Gradient pour la flèche
            const arrowGradient = ctx.createLinearGradient(12, 0, arrowLength, 0);
            arrowGradient.addColorStop(0, 'rgba(255, 0, 0, 1)');
            arrowGradient.addColorStop(1, 'rgba(255, 150, 150, 1)');
            ctx.fillStyle = arrowGradient;
            ctx.fill();
            
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
            
            // Étiquette "Robot"
            ctx.save();
            // Créer un fond arrondi pour le texte "Robot"
            const label = "Robot";
            ctx.font = 'bold 14px Arial';
            const textWidth = ctx.measureText(label).width;
            
            // Position décalée pour ne pas couvrir le robot
            const labelX = canvasCoords.x + 20;
            const labelY = canvasCoords.y - 20;
            
            // Fond blanc semi-transparent avec bordure
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(labelX - 5, labelY - 14, textWidth + 10, 20, 5);
            } else {
                // Fallback pour les navigateurs qui ne supportent pas roundRect
                ctx.rect(labelX - 5, labelY - 14, textWidth + 10, 20);
            }
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(100, 100, 100, 0.8)';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            // Texte
            ctx.fillStyle = 'rgba(200, 0, 0, 1)';
            ctx.fillText(label, labelX, labelY);
            ctx.restore();
            
            // Afficher les coordonnées
            const coordsText = `(${pose.position.x.toFixed(2)}, ${pose.position.y.toFixed(2)})`;
            ctx.font = '12px Arial';
            ctx.fillStyle = 'black';
            ctx.fillText(coordsText, canvasCoords.x + 20, canvasCoords.y + 20);
        }
        
        // Ajuster la taille du canvas
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            if (currentMapData) {
                // Réinitialiser la transformation car la taille du canvas a changé
                window.mapTransform.userModified = false;
                drawMap(currentMapData);
            }
        }
        
        // Fonction pour configurer les interactions avec la carte (zoom, déplacement)
        function setupMapInteractions() {
            let isDragging = false;
            let lastX = 0;
            let lastY = 0;
            let initialTransform = { offsetX: 0, offsetY: 0, scale: 1 };
            
            // Gestion du déplacement de la carte avec la souris
            canvas.addEventListener('mousedown', function(e) {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                canvas.style.cursor = 'grabbing';
                
                // Marquer la transformation comme modifiée par l'utilisateur
                window.mapTransform.userModified = true;
            });
            
            window.addEventListener('mouseup', function() {
                isDragging = false;
                canvas.style.cursor = 'grab';
            });
            
            window.addEventListener('mousemove', function(e) {
                if (!isDragging || !window.mapTransform) return;
                
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                
                // Mettre à jour la transformation
                window.mapTransform.offsetX += dx;
                window.mapTransform.offsetY += dy;
                
                // Redessiner
                if (currentMapData) {
                    drawMapOnly(currentMapData);
                    if (robotPosition) {
                        updateRobotPosition(robotPosition);
                    }
                }
            });
            
            // Gestion du zoom avec la molette de la souris
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                
                if (!window.mapTransform || !currentMapData) return;
                
                // Calculer le facteur de zoom basé sur la direction de la molette
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                
                // Marquer la transformation comme modifiée par l'utilisateur
                window.mapTransform.userModified = true;
                
                // Point d'origine du zoom (position de la souris)
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // Ajuster la transformation pour zoomer vers la position de la souris
                window.mapTransform.offsetX = mouseX - (mouseX - window.mapTransform.offsetX) * zoomFactor;
                window.mapTransform.offsetY = mouseY - (mouseY - window.mapTransform.offsetY) * zoomFactor;
                window.mapTransform.scale *= zoomFactor;
                
                // Limiter le zoom min et max
                window.mapTransform.scale = Math.max(0.2, Math.min(window.mapTransform.scale, 5));
                
                // Redessiner
                drawMapOnly(currentMapData);
                if (robotPosition) {
                    updateRobotPosition(robotPosition);
                }
            });
            
            // Boutons de zoom
            document.getElementById('zoomIn').addEventListener('click', function() {
                if (!window.mapTransform || !currentMapData) return;
                
                // Marquer la transformation comme modifiée par l'utilisateur
                window.mapTransform.userModified = true;
                
                // Calculer le centre du canvas
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // Zoomer sur le centre
                window.mapTransform.offsetX = centerX - (centerX - window.mapTransform.offsetX) * 1.2;
                window.mapTransform.offsetY = centerY - (centerY - window.mapTransform.offsetY) * 1.2;
                window.mapTransform.scale *= 1.2;
                
                // Limiter le zoom max
                window.mapTransform.scale = Math.min(window.mapTransform.scale, 5);
                
                // Redessiner
                drawMapOnly(currentMapData);
                if (robotPosition) {
                    updateRobotPosition(robotPosition);
                }
            });
            
            document.getElementById('zoomOut').addEventListener('click', function() {
                if (!window.mapTransform || !currentMapData) return;
                
                // Marquer la transformation comme modifiée par l'utilisateur
                window.mapTransform.userModified = true;
                
                // Calculer le centre du canvas
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // Dézoomer depuis le centre
                window.mapTransform.offsetX = centerX - (centerX - window.mapTransform.offsetX) * 0.8;
                window.mapTransform.offsetY = centerY - (centerY - window.mapTransform.offsetY) * 0.8;
                window.mapTransform.scale *= 0.8;
                
                // Limiter le zoom min
                window.mapTransform.scale = Math.max(0.2, window.mapTransform.scale);
                
                // Redessiner
                drawMapOnly(currentMapData);
                if (robotPosition) {
                    updateRobotPosition(robotPosition);
                }
            });
            
            document.getElementById('resetView').addEventListener('click', function() {
                if (!currentMapData) return;
                
                // Réinitialiser la transformation
                window.mapTransform.userModified = false;
                
                // Redessiner entièrement
                drawMap(currentMapData);
            });
        }
        
        // Fonction pour rafraîchir périodiquement l'affichage du robot
        function setupAutoRefresh() {
            setInterval(function() {
                if (robotPosition && currentMapData) {
                    // Créer une copie de l'état actuel du canvas
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Restaurer l'état de la carte
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Redessiner le robot avec effet de pulsation
                    updateRobotPosition(robotPosition);
                }
            }, 200); // Rafraîchir toutes les 200ms (évite trop de surcharge)
        }

        // Gestion des boutons
        function setupButtons() {
            document.getElementById('startMapping').addEventListener('click', function() {
                addDebugLog('Demande de démarrage SLAM...');
                
                // Appel au service pour démarrer le SLAM
                const startSlamService = new ROSLIB.Service({
                    ros: ros,
                    name: '/start_slam',
                    serviceType: 'std_srvs/Trigger'
                });

                const request = new ROSLIB.ServiceRequest({});
                
                startSlamService.callService(request, function(result) {
                    if (result.success) {
                        addDebugLog('SLAM démarré avec succès: ' + result.message);
                    } else {
                        addDebugLog('Erreur lors du démarrage du SLAM: ' + result.message);
                    }
                }, function(error) {
                    addDebugLog('Erreur de service: Impossible de démarrer le SLAM. Vérifiez que le service existe.');
                    console.error(error);
                });
            });

            document.getElementById('stopMapping').addEventListener('click', function() {
                addDebugLog('Demande d\'arrêt SLAM...');
                
                // Appel au service pour arrêter le SLAM
                const stopSlamService = new ROSLIB.Service({
                    ros: ros,
                    name: '/stop_slam',
                    serviceType: 'std_srvs/Trigger'
                });

                const request = new ROSLIB.ServiceRequest({});
                
                stopSlamService.callService(request, function(result) {
                    if (result.success) {
                        addDebugLog('SLAM arrêté avec succès: ' + result.message);
                    } else {
                        addDebugLog('Erreur lors de l\'arrêt du SLAM: ' + result.message);
                    }
                }, function(error) {
                    addDebugLog('Erreur de service: Impossible d\'arrêter le SLAM. Vérifiez que le service existe.');
                    console.error(error);
                });
            });

            document.getElementById('saveMap').addEventListener('click', function() {
                addDebugLog('Demande de sauvegarde de la carte...');
                
                // Appel au service de sauvegarde de carte
                const saveMapService = new ROSLIB.Service({
                    ros: ros,
                    name: '/save_map',
                    serviceType: 'std_srvs/Trigger'
                });

                const request = new ROSLIB.ServiceRequest({});
                
                saveMapService.callService(request, function(result) {
                    if (result.success) {
                        addDebugLog('Carte sauvegardée avec succès: ' + result.message);
                    } else {
                        addDebugLog('Erreur lors de la sauvegarde: ' + result.message);
                    }
                }, function(error) {
                    addDebugLog('Erreur de service: Impossible de sauvegarder la carte.');
                    console.error(error);
                });
            });
        }

        // Initialisation
        window.addEventListener('load', function() {
            // Initialiser le canvas
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Connexion à ROS
            connectToROS();
            
            // Configurer les interactions de carte
            setupMapInteractions();
            
            // Configurer le rafraîchissement automatique
            setupAutoRefresh();
            
            // Configurer les boutons
            setupButtons();
        });
    </script>
</body>
</html>
